<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f1ea;--ink:#1a1a1a;--soft:#666;--line:#ddd;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
--sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html,body{min-height:100%;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{display:flex;align-items:center;justify-content:center;min-height:100%;min-height:100dvh;padding:calc(var(--safeT) + 24px) 22px calc(var(--safeB) + 24px)}
.wrap{width:100%;max-width:360px}
h1{font-size:28px;font-weight:700;margin-bottom:6px}
.muted{color:var(--soft);font-size:14px;line-height:1.5;margin-bottom:22px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 16px}
input[type=password]{width:100%;padding:14px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--ink);font:500 16px var(--sans);outline:none;margin-bottom:12px}
input:focus{border-color:#999}
.row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:#1a1a1a;color:#fff;font:700 15px var(--sans)}
.btn:disabled{opacity:.5}
.err{color:#a33;font-size:13px;font-weight:600;margin-top:12px;min-height:18px}
.panel.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.foot{margin-top:16px;font-size:12px;color:#999;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <h1>Notes</h1>
  <p class="muted">Enter your password to open your notes.</p>
  <div class="panel" id="panel">
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
    <div class="row"><input type="checkbox" id="remember"><label for="remember" style="margin:0;font-size:13px;font-weight:600;color:var(--soft)">Remember on this phone</label></div>
    <button class="btn" id="go">Open</button>
    <div class="err" id="err"></div>
  </div>
  <p class="foot">Private · stored only on this device</p>
</div>

const IDB_NAME="notes-vault-v2";
const IDB_STORE="keys";
const te=new TextEncoder();
const td=new TextDecoder();
function b64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function b64from(buf){let s="";const u=new Uint8Array(buf);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE)};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
}
async function idbPut(record){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).put(record,"vault");
    tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);
  });
}
async function idbGet(){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,"readonly");
    const q=tx.objectStore(IDB_STORE).get("vault");
    q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error);
  });
}
async function idbClear(){
  try{
    const db=await idbOpen();
    await new Promise((res,rej)=>{
      const tx=db.transaction(IDB_STORE,"readwrite");
      tx.objectStore(IDB_STORE).delete("vault");
      tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);
    });
  }catch(e){}
  try{localStorage.removeItem("ad.unlock.v1");localStorage.removeItem("ad.sync.remember.v1");localStorage.removeItem("vault.sync.remember.v1")}catch(e){}
}
async function derivePackKey(password,salt,iter){
  const base=await crypto.subtle.importKey("raw",te.encode(password),{name:"PBKDF2"},false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function gunzip(buf){
  if(typeof DecompressionStream==="undefined")throw new Error("gzip unsupported");
  const stream=new Response(buf).body.pipeThrough(new DecompressionStream("gzip"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function decryptWithKey(key){
  const iv=b64(PACK.iv),ct=b64(PACK.ct);
  let plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  if(PACK.zip==="gzip")plain=await gunzip(plain);
  return td.decode(plain);
}
function captureHandoff(){
  try{
    sessionStorage.setItem("vault.return.v1", location.href.split("#")[0]);
    const h=(location.hash||"").replace(/^#/,"");
    const m=h.match(/(?:^|&)invite=([^&]+)/i) || h.match(/^invite=(.+)$/i);
    if(m){sessionStorage.setItem("vault.pairPending.v1", decodeURIComponent(m[1]))}
  }catch(e){}
}
function reveal(html){
  captureHandoff();
  const blob=new Blob([html],{type:"text/html"});
  location.replace(URL.createObjectURL(blob));
}
async function unlock(password,remember){
  const salt=b64(PACK.salt);
  const key=await derivePackKey(password,salt,PACK.iter);
  const html=await decryptWithKey(key);
  if(remember){
    await idbPut({v:2,salt:PACK.salt,iter:PACK.iter,packKey:key});
  }else{
    await idbClear();
  }
  reveal(html);
}
async function tryRemembered(){
  try{
    const saved=await idbGet();if(!saved||!saved.packKey)return false;
    if(saved.salt!==PACK.salt||saved.iter!==PACK.iter){await idbClear();return false}
    const html=await decryptWithKey(saved.packKey);
    reveal(html);
    return true;
  }catch(e){await idbClear();return false}
}
function fail(msg){
  const p=document.getElementById("panel"),e=document.getElementById("err");
  e.textContent=msg||"That password didn't work. Try again.";
  p.classList.remove("shake");void p.offsetWidth;p.classList.add("shake");
}
async function submit(){
  const pw=document.getElementById("pw").value;
  const rem=document.getElementById("remember").checked;
  const btn=document.getElementById("go");
  if(!pw){fail("Enter the password.");return}
  btn.disabled=true;document.getElementById("err").textContent="Opening…";
  try{await unlock(pw,rem)}catch(e){btn.disabled=false;fail()}
}
document.getElementById("go").onclick=submit;
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
try{localStorage.removeItem("ad.unlock.v1")}catch(e){}
try{sessionStorage.removeItem("ad.sync.v1");sessionStorage.removeItem("ad.stateKey.v1");sessionStorage.removeItem("vault.sync.v1");sessionStorage.removeItem("vault.stateKey.v1")}catch(e){}
captureHandoff();
tryRemembered();
</script>
